#----------------------------------------------- Z-Movements ------------------------------------------------
# Configurations for z-axis movements
#------------------------------------------------------------------------------------------------------------
[force_move]
enable_force_move: true            # Allows a user to move the z axis down if they have no other means of homing Z and need to calibrate the Eddy.

[safe_z_home]
home_xy_position: 90, 90           # Choose an X,Y position that is in the center of your bed. For a 300x300 machine that will be 150, 150. Use the same principle to calculate your bed center.
#z_hop: 10
#z_hop_speed: 15 #25
#speed: 50 #200

[gcode_macro SAFE_HOME_XYZ_POSITION]
gcode:
	RATOS_ECHO MSG="Move to safe home XYZ position"
#    G0 X90 Y90 Z5 F6000
    {% set pos = printer.configfile.settings.safe_z_home.home_xy_position %}
    G90
    G0 X{pos[0]} Y{pos[1]} Z5 F6000

[gcode_macro SAFE_HOME_XY_POSITION]
gcode:
	RATOS_ECHO MSG="Move to safe home XY position"
#	G0 X90 Y90 F6000
    {% set pos = printer.configfile.settings.safe_z_home.home_xy_position %}
    G90
    G0 X{pos[0]} Y{pos[1]} F6000

