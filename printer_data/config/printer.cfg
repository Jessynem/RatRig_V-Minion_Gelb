#############################################################################################################
### CONFIGURATION GENERATED BY THE RATOS CONFIGURATOR
### Everything below [include RatOS.cfg] will override default RatOS behavior
#############################################################################################################
[include RatOS.cfg]

#############################################################################################################
### MACRO CONFIGURATION
### Configure the behavior of RatOS macros
### See: https://os.ratrig.com/docs/configuration/macros
#############################################################################################################
[gcode_macro RatOS]
variable_relative_extrusion: False
variable_preheat_extruder: False
variable_preheat_extruder_temp: 220
variable_calibrate_bed_mesh: False
variable_adaptive_mesh: False
variable_bed_mesh_profile: "default"
variable_nozzle_priming: "primeblob"
variable_start_print_park_in: "front"
variable_start_print_park_z_height: 50
variable_end_print_park_in: "back"
variable_end_print_park_z_hop: 10
variable_pause_print_park_in: "front"
variable_macro_travel_speed: 200
variable_macro_travel_accel: 3000
variable_macro_z_speed: 15
variable_filament_load_temp: 235        # temperature to heat up hotend for filament loading, default is 235
variable_filament_unload_temp: 185      # temperature to heat up hotend for filament un-loading, default is 185
variable_filament_load_min_temp: 190    # minimum hotend set temperature allowed in filament load macro, default is 190
variable_nozzle_purge_length: 200       # filament extrude amount during load sequenc, hotend purge from old filament, default is 200
variable_nozzle_purge_speed: 300        # filament extrude speed in mm/min adjust this value lower if flow is too high and extruder skips during loading, default is 300
variable_unload_distance: 65            # filament retract distance for unload procedure. this length shall be long enough to extract the filament above the drive gears
variable_park_retraction: 1             # edit your retraction amount for parking, default is 1
variable_adaptive_mesh: False
### Orbiter Smart Sensor
variable_disable_autoload: False        # disable filament autoload feature by setting this variable True
variable_disable_autounload: True       # disable filamen unload by unload button
variable_disable_autochange: True       # disable filament auto change after runout detection
#variable_disable_runout: False         # disable runout by setting this variable True
#variable_disable_tangle: True          # disable tangle by setting this variable True
### New
variable_enable_insert_detection: True  # Enable the filament sensor insert detection.
variable_enable_runout_detection: True  # Enable the filament sensor runout detection.
variable_enable_clog_detection: False   # Enable the filament sensor clog detection.
variable_unload_after_runout: True      # Unload filament from toolhead after if runout has been detected.
variable_resume_after_insert: True      # Auto resume a paused print after runout and insert.
variable_toolhead_sensor_button_only_when_sensor_enabled: False  # Only trigger filament sensor button when the sensor is enabled.
variable_toolhead_detect_clog_only_when_sensor_enabled: True     # Only detect clogs when the filament sensor is enabled.
variable_purge_after_load: 10           # Purge x mm after the filament has been loaded to the nozzle tip.
#variable_filament_load_length: 100      # How much to extrude in mm when loading filament to get the filament to the nozzle
variable_purge_before_unload: 5         # Purge x mm before the filament unloads.
#variable_filament_unload_length: 130    # How much to retract in mm when unloading filament after the tip has been formed

#############################################################################################################
### USER OVERRIDES & CUSTOM CONFIGURATION
### Anything custom you want to add, or RatOS configuration you want to override, do it here.
### This section is pre-populated with the most common settings you may want to change.
### See: https://os.ratrig.com/docs/configuration/includes-and-overrides
###
### It is recommended that you follow these steps to properly calibrate your printer:
### 0) Sanity check and PID Tuning: https://www.klipper3d.org/Config_checks.html
### 1) Z-offset calibration: https://www.klipper3d.org/Probe_Calibrate.html#calibrating-probe-z-offset
### 2) Pressure Advance: https://www.klipper3d.org/Pressure_Advance.html
### 3) Skew Correction: https://www.klipper3d.org/Skew_Correction.html
### 4) Resonance Compensation: https://www.klipper3d.org/Resonance_Compensation.html
### RatOS has dedicated macro's to generate shaper graphs for deeper analysis (requires accelerometer).
### Use GENERATE_SHAPER_GRAPHS to generate the resonance graphs for analysing and manually entering 
### input shaper configuration.
### You can run SHAPER_CALIBRATE to automatically calibrate your input shaper configuration, if you just want
### to get started.
### Additionally, you can use the Realtime Analysis Tool to analyze your printer's performance in real-time.
### Read more about klipper here: https://www.klipper3d.org/Overview.html
#############################################################################################################

#------------------------------------------------ MOONGATE --------------------------------------------------
# Include the MOONGATE Plugin
#------------------------------------------------------------------------------------------------------------
[include moongate.cfg]

#-------------------------------------------------- RatOS ---------------------------------------------------
# RatOS
#------------------------------------------------------------------------------------------------------------
[ratos]
allow_unsupported_slicer_versions: True

#------------------------------------------------ Variables -------------------------------------------------
# Variables
#------------------------------------------------------------------------------------------------------------
[save_variables]
filename: ~/printer_data/config/variables.cfg

#----------------------------------------- Duplicate PIN Override -------------------------------------------
# PINs that are used multiple times
#------------------------------------------------------------------------------------------------------------
[duplicate_pin_override]
#pins: mcu:PA7, PA5

#--------------------------------------------- exclude Objects ----------------------------------------------
# Enable object exclusion
#------------------------------------------------------------------------------------------------------------
[exclude_object]

#-------------------------------------------------- Arcs ----------------------------------------------------
# Enable arcs support
#------------------------------------------------------------------------------------------------------------
[gcode_arcs]
resolution: 0.1

#------------------------------------------------ Printer ---------------------------------------------------
# max movement values
#------------------------------------------------------------------------------------------------------------
[printer]
#max_accel: 6200                    # should not exceed the estimated max_accel for X and Y axes
#max_z_velocity: 20
#max_z_accel: 1550

#-------------------------------------------------- Skew ----------------------------------------------------
# Skew correction
#------------------------------------------------------------------------------------------------------------
[skew_correction]

#[gcode_macro _USER_START_PRINT_AFTER_HEATING_BED]
#gcode:
#    SET_SKEW CLEAR=1
#    RATOS_ECHO MSG="Clear Skew-Profile to load new Skew-Profile"
#    SKEW_PROFILE LOAD=CaliFlower
#    RATOS_ECHO MSG="Load Skew-Profile "CaliFlower" to correct Skew"

#[gcode_macro _USER_END_PRINT_BEFORE_HEATERS_OFF]
#gcode:
#    SET_SKEW CLEAR=1
#    RATOS_ECHO MSG="Clear Skew-Profile"


#---------------------------------------------------- X -----------------------------------------------------
# The X axis motor moves the print head left and right.
#------------------------------------------------------------------------------------------------------------
[stepper_x]
dir_pin: !x_dir_pin                # Remove ! in front of pin name to reverse the direction of stepper_x
rotation_distance: 40              # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: -3
position_max: 180
position_endstop: -3

#---------------------------------------------------- Y -----------------------------------------------------
# The Y axis motor moves the print bed forward and backward.
#------------------------------------------------------------------------------------------------------------
[stepper_y]
dir_pin: y_dir_pin                 # Remove ! in front of pin name to reverse the direction of stepper_y
rotation_distance: 40              # 40 for 20 tooth 2GT pulleys, 32 for 16 tooth 2GT pulleys
homing_speed: 50
position_min: -4
position_max: 180
position_endstop: -4

#---------------------------------------------------- Z -----------------------------------------------------
# The Z axis motor moves the print head up and down.
#------------------------------------------------------------------------------------------------------------
[stepper_z]
dir_pin: z0_dir_pin                # Remove ! in front of pin name to reverse the direction of stepper_z
rotation_distance: 8               # 4 for TR8*4 lead screws
homing_speed: 10
position_min: -5
position_max: 180

#------------------------------------------------- EXTRUDER -------------------------------------------------
# The extruder motor used for your toolhead
#------------------------------------------------------------------------------------------------------------
[extruder]
dir_pin: toolboard_t0:e_dir_pin    # Remove ! in front of pin name to reverse the direction of extruder
rotation_distance: 4.65778         # Orbiter 2 default
pressure_advance: 0.0575           # Check https://www.klipper3d.org/Pressure_Advance.html for pressure advance tuning.
#control: pid
#pid_kp: 21.673
#pid_ki: 1.338
#pid_kd: 87.776

#--------------------------------------------- PART COOLING FAN ---------------------------------------------
# Part cooling fan on printhead with 4pin
#------------------------------------------------------------------------------------------------------------
[fan]
max_power: 1.0
kick_start_time: 0.100
shutdown_speed: 0
off_below: 0.05

#---------------------------------------------- CONTROLLER FAN ----------------------------------------------
# Controller fan on controller to cool steppers and mcu
#------------------------------------------------------------------------------------------------------------
[controller_fan steppers]
pin: PF8
max_power: 0.8
off_below: 0.1
idle_speed: 0.2
idle_timeout: 60
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2

#[controller_fan controller_fan]
#max_power: 1.0					# Full power for rapid cooling.     
#cycle_time: 0.01
#kick_start_time: 5.0			# Delay to prevent false starts.
#shutdown_speed: 0.0
#off_below: 0.1
#idle_speed: 0.2
#sensor_type: temperature_host     # Sets the type of sensor for Klipper to read
#sensor_mcu: rpi
#target_temp: 35
#control: watermark

#----------------------------------------------- INPUT SHAPER -----------------------------------------------
# Input shaper configuration from resonnance test
#------------------------------------------------------------------------------------------------------------
[input_shaper]
shaper_freq_x: 72.6                # Frequency found for X axis
shaper_type_x: ei                  # Recommended type (e.g., mzv, ei, 2hump_ei)
#shaper_freq_y: 46.0                # Frequency found for Y axis
#shaper_type_y: mzv                 # Recommended type (e.g., mzv, ei, 2hump_ei)
#shaper_freq_z: 45.0                # Frequency found for Z axis
#shaper_type_z: mzv                 # Recommended type (e.g., mzv, ei, 2hump_ei)

#--------------------------------------------- FILAMENT SENSOR ----------------------------------------------
# Orbiter 2 Smart Filament Sensor
# Orbiter-smart-sensor connected to toolboard
#------------------------------------------------------------------------------------------------------------
[filament_switch_sensor toolhead_filament_sensor_t0]
switch_pin: ^toolboard_t0:PB4
pause_on_runout: False
event_delay: 2.0                   # The minimum amount of time in seconds to delay between events. Events triggered during this time period will be silently ignored. The default is 3 seconds.
pause_delay: 1.0                   # The amount of time to delay, in seconds, between the pause command dispatch and execution of the runout_gcode. It may be useful to increase this delay if OctoPrint exhibits strange pause behavior. Default is 0.5 seconds.

[gcode_button filament_sensor_button]
pin: ^toolboard_t0:PB3
press_gcode:
    {% if (printer.print_stats.state == "printing") %}
        _ON_TOOLHEAD_FILAMENT_SENSOR_CLOG TOOLHEAD=0
    {% else %}
    {% endif %}
release_gcode:
	# No action on release

